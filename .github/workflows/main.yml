name: Monthly Notion Summary

on:
  schedule:
    - cron: '0 0 1 * *'
  workflow_dispatch:
    inputs:
      provider:
        description: Model provider for this run
        type: choice
        options:
          - configured
          - deepseek
          - orcarouter
        default: configured
      test_page:
        description: Create and verify a separate Notion test page
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  notion-update:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      OPENAI_BASE_URL: ${{ (inputs.provider == 'orcarouter' || ((inputs.provider == '' || inputs.provider == 'configured') && vars.LLM_PROVIDER == 'orcarouter')) && 'https://api.orcarouter.ai/v1' || 'https://api.deepseek.com' }}
      OPENAI_MODEL: ${{ (inputs.provider == 'orcarouter' || ((inputs.provider == '' || inputs.provider == 'configured') && vars.LLM_PROVIDER == 'orcarouter')) && 'deepseek/deepseek-v4-flash-free' || 'deepseek-reasoner' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run offline regression tests
        run: python -B -m unittest discover -s tests -v

      # --- 预检：确认 Secrets 是否注入（不打印明文，只打印长度）---
      - name: Preflight check (env)
        env:
          OPENAI_API_KEY:   ${{ secrets[(inputs.provider == 'orcarouter' || ((inputs.provider == '' || inputs.provider == 'configured') && vars.LLM_PROVIDER == 'orcarouter')) && 'ORCAROUTER_API_KEY' || 'DEEPSEEK_API_KEY'] }}
          NOTION_TOKEN:     ${{ secrets.NOTION_TOKEN }}
          PAGE_ID:          ${{ secrets.NOTION_PAGE_ID }}
          QUERY_KEYWORDS:   ${{ vars.QUERY_KEYWORDS || secrets.QUERY_KEYWORDS }}
        run: |
          python - <<'PY'
          import os, re
          def mask(v): 
              return "MISSING" if not v else f"len={len(v)}"
          print("OPENAI_BASE_URL:", os.environ.get("OPENAI_BASE_URL"))
          print("OPENAI_API_KEY :", mask(os.environ.get("OPENAI_API_KEY")))
          print("NOTION_TOKEN   :", mask(os.environ.get("NOTION_TOKEN")))
          print("PAGE_ID        :", mask(os.environ.get("PAGE_ID")))
          pid = os.environ.get("PAGE_ID","")
          missing = [name for name in ("OPENAI_API_KEY", "NOTION_TOKEN", "PAGE_ID") if not os.environ.get(name)]
          if missing:
              raise SystemExit("Missing required configuration: " + ", ".join(missing))
          if not re.fullmatch(r"[0-9a-fA-F]{32}|[0-9a-fA-F]{8}(?:-[0-9a-fA-F]{4}){3}-[0-9a-fA-F]{12}", pid):
              raise SystemExit("NOTION_PAGE_ID must be a page ID, not a page URL.")
          PY

      - name: Create isolated Notion test page
        id: test-page
        if: inputs.test_page
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          PARENT_PAGE_ID: ${{ secrets.NOTION_PAGE_ID }}
        run: |
          python - <<'PYTHON'
          import os
          import requests

          title = "Paper tracker test " + os.environ["GITHUB_RUN_ID"]
          response = requests.post(
              "https://api.notion.com/v1/pages",
              headers={
                  "Authorization": "Bearer " + os.environ["NOTION_TOKEN"],
                  "Notion-Version": "2022-06-28",
                  "Content-Type": "application/json",
              },
              json={
                  "parent": {"page_id": os.environ["PARENT_PAGE_ID"]},
                  "properties": {"title": {"title": [{"text": {"content": title}}]}},
              },
              timeout=30,
          )
          response.raise_for_status()
          page_id = response.json()["id"]
          print("::add-mask::" + page_id)
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write("page_id=" + page_id + "\n")
          print("Created isolated test page.")
          PYTHON

      # --- 真正运行你的脚本，并把日志输出 ---
      - name: Run push_summary.py
        env:
          CCF_A_VENUES: ${{ vars.CCF_A_VENUES }}
          SEMANTIC_SCHOLAR_API_KEY: ${{ secrets.SEMANTIC_SCHOLAR_API_KEY }}
          OPENAI_API_KEY:   ${{ secrets[(inputs.provider == 'orcarouter' || ((inputs.provider == '' || inputs.provider == 'configured') && vars.LLM_PROVIDER == 'orcarouter')) && 'ORCAROUTER_API_KEY' || 'DEEPSEEK_API_KEY'] }}
          NOTION_TOKEN:     ${{ secrets.NOTION_TOKEN }}
          PAGE_ID:          ${{ steps.test-page.outputs.page_id || secrets.NOTION_PAGE_ID }}
          QUERY_KEYWORDS:   ${{ vars.QUERY_KEYWORDS || secrets.QUERY_KEYWORDS }}
        run: |
          python -u push_summary.py

      - name: Verify generated Notion blocks
        if: inputs.test_page
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          PAGE_ID: ${{ steps.test-page.outputs.page_id }}
        run: |
          python - <<'PYTHON'
          import os
          import requests

          blocks = []
          cursor = None
          while True:
              params = {"page_size": 100}
              if cursor:
                  params["start_cursor"] = cursor
              response = requests.get(
                  "https://api.notion.com/v1/blocks/" + os.environ["PAGE_ID"] + "/children",
                  headers={
                      "Authorization": "Bearer " + os.environ["NOTION_TOKEN"],
                      "Notion-Version": "2022-06-28",
                  },
                  params=params,
                  timeout=30,
              )
              response.raise_for_status()
              data = response.json()
              blocks.extend(data["results"])
              if not data.get("has_more"):
                  break
              cursor = data["next_cursor"]
          assert any(b["type"] == "heading_1" for b in blocks), "Missing report title"
          linked_papers = [b for b in blocks if b["type"] == "heading_3" and any(
              t.get("text", {}).get("link") for t in b["heading_3"]["rich_text"]
          )]
          assert linked_papers, "Missing clickable paper titles"
          sections = {"".join(t.get("plain_text", "") for t in b["heading_2"]["rich_text"])
                      for b in blocks if b["type"] == "heading_2"}
          assert {"样本观察", "arXiv 论文列表", "指定会场论文与检索状态"} <= sections, "Missing report sections"
          print("Verified", len(blocks), "blocks and", len(linked_papers), "linked paper titles.")
          PYTHON
